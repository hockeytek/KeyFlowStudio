name: Model Smoke

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tests/**"
      - "UI/**"
      - "ec2_worker/**"
      - "requirements.txt"
      - "main.py"
      - "KeyFlow.spec"
      - ".github/workflows/model-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "tests/**"
      - "UI/**"
      - "ec2_worker/**"
      - "requirements.txt"
      - "main.py"
      - "KeyFlow.spec"
      - ".github/workflows/model-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1 libglib2.0-0
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pytest numpy Pillow requests psutil boto3 opencv-python-headless huggingface_hub tqdm transformers
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
      - name: Run smoke tests
        env:
          QT_QPA_PLATFORM: offscreen
          KEYFLOW_DEVICE: cpu
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/test_node_graph_dialog_smoke.py -q